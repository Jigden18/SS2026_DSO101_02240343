# render.yaml — Render Blueprint
# On every git push to main, Render rebuilds and redeploys automatically.

services:
  # ── BACKEND ──────────────────────────────────────────────────────────────
  - type: web
    name: be-todo-github
    runtime: docker
    branch: main
    dockerfilePath: ./JigdenShakya_02240343_DSO101_A1/backend/Dockerfile
    dockerContext: ./JigdenShakya_02240343_DSO101_A1/backend
    region: singapore
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://fe-todo-github.onrender.com

  # ── FRONTEND ─────────────────────────────────────────────────────────────
  - type: web
    name: fe-todo-github
    runtime: docker
    branch: main
    dockerfilePath: ./JigdenShakya_02240343_DSO101_A1/frontend/Dockerfile
    dockerContext: ./JigdenShakya_02240343_DSO101_A1/frontend
    region: singapore
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://be-todo-github.onrender.com